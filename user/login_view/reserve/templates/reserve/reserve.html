{% extends 'base.html' %}
{% load static %}
{% block extra_css %}
<link rel="stylesheet" href="{% static 'reserve/css/calendar.css' %}">
{% endblock %}
{% block content %}
<h3>予約画面</h3>
<div class="main_contents">
    <div class="reserve-container">
        {% include 'reserve/include/calendar.html' %}
        <style>
            .calendar-close-btn {
                display: none;
            }
        </style>

    </div>
</div>

<!-- モーダルオーバーレイ（スマホ版用） -->
<div class="modal-overlay" id="modal-overlay"></div>

<!-- 時間選択モーダル（スマホ版用） -->
<div class="time-selection-modal" id="time-selection-panel">
    <div class="time-selection-content">
        <div class="time-selection-header">
            <h3 id="selected-date-display">日付を選択してください</h3>
            <button class="close-btn" id="close-time-panel">&times;</button>
        </div>
        <div class="time-slots">
            <p class="time-label">時間を選択してください（10時〜14時）</p>
            <div class="time-buttons">
                {% for time_slot in times %}
                <button class="time-btn" data-time="{{ time_slot }}">{{ time_slot }}<br></button>
                {% endfor %}
            </div>
        </div>
        <div class="reserve-form-section" id="reserve-form-section" style="display: none;">
            <form method="POST" id="reserve-form">
                {% csrf_token %}
                <input type="hidden" name="selected_date" id="selected-date-input">
                <input type="hidden" name="selected_time" id="selected-time-input">
                <div class="form-summary">
                    <p><strong>予約内容</strong></p>
                    <p>日付: <span id="form-date-display"></span></p>
                    <p>時間: <span id="form-time-display"></span></p>
                </div>
                <div class="form-actions">
                    <button type="button" class="submit-btn">予約を確定</button>
                    <button type="button" class="cancel-btn" id="cancel-reserve">キャンセル</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- 予約済み日付データをJavaScriptに渡す -->
<script>
    // Djangoから予約済み日付のリストを取得
    window.reservedDates = [
        {% for date in reserved_dates %}
        '{{ date }}'{% if not forloop.last %},{% endif %}
        {% endfor %}
    ];
    
    // Djangoから予約済み時間の辞書を取得（日付ごと）
    window.reservedTimesByDate = {
        {% for date, times in reserved_times_by_date.items %}
        '{{ date }}': [
            {% for time in times %}
            '{{ time }}'{% if not forloop.last %},{% endif %}
            {% endfor %}
        ]{% if not forloop.last %},{% endif %}
        {% endfor %}
    };
</script>

<script src="{% static 'reserve/js/calendar.js' %}"></script>
<script src="{% static 'reserve/js/reserve_async.js' %}"></script>
{% endblock %}
