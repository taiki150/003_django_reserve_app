{% load static %}
<div class="calendar-overlay" id="calendar-overlay"></div>
<div class="calendar-wrapper" id="calendarBox">
    <button class="calendar-close-btn" id="calendar-close-btn">&times;</button>
    <div class="calendar">
        
        <div class="calendar-header">
            <h2 class="calendar-month-year" id="month-year"></h2>
        </div>
        <div class="calendar-weekdays">
            <div class="weekday">日</div>
            <div class="weekday">月</div>
            <div class="weekday">火</div>
            <div class="weekday">水</div>
            <div class="weekday">木</div>
            <div class="weekday">金</div>
            <div class="weekday">土</div>
        </div>
        <div class="calendar-days" id="calendar-days">
            <script src="{% static 'reserve/js/calendar_sub.js' %}"></script>
            {% comment %} 今月の日付を表示 {% endcomment %}
            {% for day in days %}
                <div class="calendar-day" data-date="{{ day }}">
                    {{ day }}
                </div>
            {% endfor %}
        </div>
    </div>
</div>

<!-- PC版: 右側の予約詳細パネル -->
<div class="reserve-detail-panel" id="reserve-detail-panel">
    <div class="time-selection-content">
        <div class="time-selection-header">
            <h3 id="selected-date-display-pc">日付を選択してください</h3>
            <button class="close-btn pc-close-btn" id="close-time-panel-pc" style="display: none;">&times;</button>
        </div>
        <div class="time-slots">
            <p class="time-label">時間を選択してください（10時〜14時）</p>
            <div class="time-buttons">
                <button class="time-btn" data-time="10:00">10:00</button>
                <button class="time-btn" data-time="11:00">11:00</button>
                <button class="time-btn" data-time="12:00">12:00</button>
                <button class="time-btn" data-time="13:00">13:00</button>
                <button class="time-btn" data-time="14:00">14:00</button>
            </div>
        </div>
        <div class="reserve-form-section" id="reserve-form-section-pc" style="display: none;">
            <form method="POST" action="{% url 'reserve:reseve_create' %}" id="reserve-form-pc">
                {% csrf_token %}
                <input type="hidden" name="selected_date" id="selected-date-input-pc">
                <input type="hidden" name="selected_time" id="selected-time-input-pc">
                <div class="form-summary">
                    <p><strong>予約内容</strong></p>
                    <p>日付: <span id="form-date-display-pc"></span></p>
                    <p>時間: <span id="form-time-display-pc"></span></p>
                </div>
                <div class="form-actions">
                    <button type="submit" class="submit-btn">予約を確定</button>
                    <button type="button" class="cancel-btn" id="cancel-reserve-pc">キャンセル</button>
                </div>
            </form>
        </div>
    </div>
</div>
