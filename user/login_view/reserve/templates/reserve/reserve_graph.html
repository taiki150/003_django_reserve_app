{% extends 'base.html' %}
{% load static %}
{% block extra_css %}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
<link rel="stylesheet" href="{% static 'reserve/css/reserve_graph.css' %}">
<script src="{% static 'reserve/js/calendar_sub.js' %}"></script>
{% endblock %}
{% block content %}

<h3>混雑状況</h3>
<div class="loade_view">
    <div class="loader">Loading...</div>
</div>

<div class="graph">
    <div class="nav">
        <div class="nav_head">
            <h4 class="">期間の絞り込み</h4>
            <button class="opne close">
                <span></span>
                <span></span>
            </button>
        </div>
        <button class="period_btn active close">全て</button>
        <button class="period_btn close">１か月</button>
        <button class="period_btn close">３か月</button>
    </div>

    <div class="graph_box">
        <div class="graph_card">
            <h4 class="graph_card_title">予約集中ヒートマップ</h4>
            <div class="graph_card_inner">
                <canvas id="heatmapChart" aria-label="曜日・時間帯別予約件数ヒートマップ"></canvas>
            </div>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-chart-matrix@3.0.0/dist/chartjs-chart-matrix.min.js"></script>
<script src="{% static 'reserve/js/graph.js' %}"></script>
{% endblock %}
