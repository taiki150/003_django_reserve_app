{% load static %}

<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
        <link rel="stylesheet" href="{% static 'acounts/css/auth_style.css' %}">
        <link rel="stylesheet" href="{% static 'admin_app/css/auth_style.css' %}">
        <link rel="stylesheet" href="{% static 'css/base.css' %}">
        <link rel="stylesheet" href="{% static 'css/base_admin.css' %}">
        {% block extra_css %}{% endblock %}
    </head>

    <body>
        <nav>
            <!-- PC版: 通常のナビゲーション -->
            <div class="nav-links pc-nav">
                <a href="{% url 'admin_app:home' %}">ホーム</a>
                {% if user.is_authenticated %}
                <a href="{% url 'admin_app:reserve' %}">予約管理</a>
                {% else %}
                <a href="{% url 'admin_app:login' %}">管理者ログイン</a>
                
                {% endif %}
            </div>
            
            <!-- SP版: ハンバーガーメニュー -->
            <div class="mobile-nav">
                <button class="hamburger-btn" id="hamburger-btn" aria-label="メニュー">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
                <div class="mobile-menu-overlay" id="mobile-menu-overlay"></div>
                <div class="mobile-menu" id="mobile-menu">
                    <a href="{% url 'admin_app:home' %}">ホーム</a>
                    {% if user.is_authenticated %}
                    <a href="{% url 'admin_app:reserve' %}">予約管理</a>
                    <a href="{% url 'acounts:user_logout2' %}">ログアウト</a>
                    {% else %}
                    <a href="{% url 'admin_app:login' %}">管理者ログイン</a>
                    {% endif %}
                </div>
            </div>
        </nav>
        <div class="main_contents">
            <form id="logout_form" action="{% url 'acounts:user_logout2' %}" method="post">
                {% csrf_token %}
            </form>
            {% block content %}
            {% endblock %}
        </div>
        <script>
            // ハンバーガーメニューの開閉
            document.addEventListener('DOMContentLoaded', function() {
                const hamburgerBtn = document.getElementById('hamburger-btn');
                const mobileMenu = document.getElementById('mobile-menu');
                const mobileMenuOverlay = document.getElementById('mobile-menu-overlay');
                
                function toggleMenu() {
                    hamburgerBtn.classList.toggle('active');
                    mobileMenu.classList.toggle('active');
                    if (mobileMenuOverlay) {
                        mobileMenuOverlay.classList.toggle('active');
                    }
                    // メニューが開いている時は背景のスクロールを無効化
                    if (mobileMenu.classList.contains('active')) {
                        document.body.style.overflow = 'hidden';
                    } else {
                        document.body.style.overflow = '';
                    }
                }
                
                function closeMenu() {
                    hamburgerBtn.classList.remove('active');
                    mobileMenu.classList.remove('active');
                    if (mobileMenuOverlay) {
                        mobileMenuOverlay.classList.remove('active');
                    }
                    document.body.style.overflow = '';
                }
                
                if (hamburgerBtn && mobileMenu) {
                    hamburgerBtn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        toggleMenu();
                    });
                    
                    // オーバーレイをクリックしたらメニューを閉じる
                    if (mobileMenuOverlay) {
                        mobileMenuOverlay.addEventListener('click', closeMenu);
                    }
                    
                    // メニューリンクをクリックしたらメニューを閉じる
                    mobileMenu.querySelectorAll('a').forEach(link => {
                        link.addEventListener('click', closeMenu);
                    });
                    
                    // ESCキーでメニューを閉じる
                    document.addEventListener('keydown', function(e) {
                        if (e.key === 'Escape' && mobileMenu.classList.contains('active')) {
                            closeMenu();
                        }
                    });
                }
            });
            
            // ログアウトリンク（既存のコード）
            const logoutLink = document.getElementById('logout_link');
            if (logoutLink) {
                logoutLink.addEventListener('click', function(e){
                    e.preventDefault();
                    document.getElementById('logout_form').submit();
                });
            }
        </script>
    </body>
</html>
